name: Messengers (Telegram + MAX)

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests urllib3

      - name: Run messengers agent
        run: python agent.py
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GROQ_KEY_TEASER: ${{ secrets.GROQ_KEY_TEASER }}
          OPENROUTER_KEY_TEASER: ${{ secrets.OPENROUTER_KEY_TEASER }}
        
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}

      - name: Commit site files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add img/ a/ posts.json rss.xml index.html 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: messengers post [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
