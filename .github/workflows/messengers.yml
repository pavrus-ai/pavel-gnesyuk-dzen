name: Messengers Agent

on:
  schedule:
    - cron: "30 8 * * *"      # оставьте ваш текущий cron, если отличается
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests Pillow

      - name: Run messengers agent
        run: python agent.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}
          GIGACHAT_CLIENT_ID1: ${{ secrets.GIGACHAT_CLIENT_ID1 }}
          GIGACHAT_CLIENT_SECRET1: ${{ secrets.GIGACHAT_CLIENT_SECRET1 }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GROQ_KEY2: ${{ secrets.GROQ_KEY2 }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENROUTER_KEY2: ${{ secrets.OPENROUTER_KEY2 }}
          CEREBRAS_KEY: ${{ secrets.CEREBRAS_KEY }}
          MISTRAL_KEY: ${{ secrets.MISTRAL_KEY }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}

      - name: Commit images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f img/ || true
          git commit -m "chore: dzen images [skip ci]" || echo "ℹ️ Нет изменений для коммита"
          git pull --rebase || true
          git push || echo "⚠️ push не удался — закоммитим в следующий раз"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
