name: Dzen RSS Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"

jobs:
  dzen:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ️ ВАЖНО: права на запись

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - run: pip install requests
      
      - name: Run Dzen agent
        run: python dzen_agent.py
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GROQ_KEY2: ${{ secrets.GROQ_KEY2 }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENROUTER_KEY2: ${{ secrets.OPENROUTER_KEY2 }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ERROR_EMAIL_TO: ${{ secrets.ERROR_EMAIL_TO }}
          
      - name: Commit and push Dzen files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Добавляем ВСЕ файлы, которые создаёт dzen_agent.py
          git add dzen-rss.xml a/ img/
          
          # Проверяем, есть ли изменения, и делаем commit только если они есть
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update dzen-rss and articles [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
