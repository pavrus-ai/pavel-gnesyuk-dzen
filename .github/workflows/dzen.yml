name: Dzen Article Agent
on:
  schedule:
    # 18:00 МСК = 15:00 UTC
    - cron: "0 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  article:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run agent
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        run: python agent.py
      - name: Commit feed
        run: |
          git config --global user.name "dzen-agent"
          git config --global user.email "pavel-gnesyuk-dzen@users.noreply.github.com"
          git add rss.xml posts.json img/
          git diff --staged --quiet || (git commit -m "dzen article update" && git push)
