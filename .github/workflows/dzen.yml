name: Main Agent (RSS, Site, TG, MAX)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"  # Запуск каждый день в 09:00 UTC

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # ⚠️ ВАЖНО: Даёт права на запись в репозиторий

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Main Agent
        run: python agent.py
        env:
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          MAX_TOKEN: ${{ secrets.MAX_TOKEN }}
          MAX_CHAT_ID: ${{ secrets.MAX_CHAT_ID }}

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Добавляем все файлы, которые генерирует agent.py
          git add rss.xml index.html posts.json a/ img/
          
          # Проверяем, есть ли изменения, и делаем коммит только если они есть
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update rss, index and articles [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
